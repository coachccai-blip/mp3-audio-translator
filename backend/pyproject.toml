[project]
name = "doublr"
version = "0.1.0"
description = "Doublage audio par IA avec voix natives et durée identique"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "sqlmodel>=0.0.16",
  "numpy>=1.26",
  "scipy>=1.11",
  "soundfile>=0.12",
  "pyloudnorm>=0.1.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "anthropic>=0.60",
  "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
# Modèles IA locaux (lourds : PyTorch). Installer avec `pip install -e ".[ai]"`.
ai = [
  # Versions figées et testées ensemble (voir .github/workflows/windows-installer.yml).
  "torch==2.5.1",
  "torchaudio==2.5.1",
  "numpy>=2.0.2",
  "faster-whisper>=1.1,<2",
  "demucs==4.0.1",
  "pyannote.audio>=3.3,<4",
  "pyrubberband>=0.3",
  # Mode gratuit : voix locales
  "kokoro-onnx>=0.4.9,<1",
  "misaki[zh]>=0.9,<1",  # prononciation native du mandarin avec Kokoro
  "piper-tts>=1.3,<2",
]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
