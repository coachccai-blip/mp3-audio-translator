# Catalogue de voix NATIVES uniquement (voir brief §4.1).
# - Aucune voix « Multilingual », aucun clonage, aucun jeu de données multi-locuteurs ou non natif.
# - Fournisseurs :
#     kokoro  gratuit, local, HD 24 kHz (Kokoro-82M, Apache 2.0)
#     piper   gratuit, local (voix VITS ; licence propre à chaque voix, voir son MODEL_CARD)
#     azure   clé AZURE_SPEECH_KEY (identifiants à CONFIRMER : `python scripts/sync_azure_voices.py`)
#   Une voix n'est proposée que si son fournisseur est utilisable (installé ou clé renseignée).
# - quality : hd | standard. gender « unknown » = non vérifié.
# - `validated_by` / `validated_on` : à remplir après écoute par un locuteur natif (`python scripts/audition.py`).
#   Tant que DOUBLR_REQUIRE_VALIDATED_VOICES=true, seules les voix validées sont proposées.

